<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — silicon.wang</title>
<meta name="description" content="Get in touch with silicon.wang about die bonding, packaging, sourcing, testing, manufacturing or fulfillment.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%230b0e14%22/><rect x=%2230%22 y=%2230%22 width=%2240%22 height=%2240%22 fill=%22none%22 stroke=%22%2338bdf8%22 stroke-width=%226%22/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">silicon<span>.wang</span></a>
    <nav class="nav">
      <a href="services.html">Services</a>
      <a href="customers.html">Customers</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </div>
</header>

<main>

  <section class="contact">
    <div class="wrap contact-grid">
      <div>
        <p class="eyebrow">Get in touch</p>
        <h1>Tell us about your project</h1>
        <p class="lede">Die bonding, packaging, sourcing, testing, manufacturing or
        fulfillment — let us know what you need and we'll get back to you.</p>

        <!--
          Contact form: submits to Formspree.
          Replace YOUR_FORM_ID below with the endpoint from your Formspree account
          (https://formspree.io) before going live.
        -->
        <form id="contact-form" class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <div class="form-row">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-row">
            <label for="company">Company</label>
            <input type="text" id="company" name="company">
          </div>
          <div class="form-row">
            <label for="message">What do you need help with?</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn">Send message</button>
          <p id="form-status" class="form-status" role="status"></p>
        </form>
      </div>
      <img class="hero-image" src="assets/placeholders/gallery-09.svg" alt="silicon.wang team at work (placeholder photo)">
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <p>&copy; <span id="year"></span> silicon.wang</p>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
